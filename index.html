<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    body {
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: pink;
    }
    .aa {
        width: 200px;
        height: 200px;
        border-radius: 50%;
        background: #35d4ec;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 35px;
    }
</style>
<script src="./16-多维动态规划/072.编辑距离.js"></script>
<script>
    function dianji() {
        const cases = [
            ['horse', 'ros', 3],               // 示例 1
            ['intention', 'execution', 5],     // 示例 2
            ['', '', 0],
            ['abc', '', 3],                    // 只能删 3 次
            ['', 'abc', 3],                    // 只能插 3 次
            ['a', 'a', 0],                     // 一模一样
            ['a', 'b', 1],                     // 替换一次
            ['ab', 'ba', 2],                   // 换不动，得删了再插
            ['sunday', 'saturday', 3],         // 经典例子
            ['abc', 'abcabc', 3]
        ]
        for (const [a, b, exp] of cases) {
            const all = [
                minDistance(a, b),
                minDistance1D(a, b),
                minDistanceMemo(a, b)
            ]
            // 暴力版无记忆化，指数级，只在短串上参与对比
            if (a.length <= 7 && b.length <= 7) all.push(minDistanceBrute(a, b))
            const ok = all.every(v => v === exp)
            console.log(
                ok ? 'PASS' : 'FAIL',
                `${JSON.stringify(a)},${JSON.stringify(b)}`.padEnd(30),
                '二维:', String(all[0]).padEnd(3),
                '一维:', String(all[1]).padEnd(3),
                '记忆化:', String(all[2]).padEnd(3),
                all[3] === undefined ? '' : '暴力: ' + all[3],
                ' 期望', exp
            )
        }

        // ★ 用数学性质自查（比死记答案更靠谱）★
        const rnd = () => {
            const n = Math.floor(Math.random() * 7)
            let s = ''
            for (let i = 0; i < n; i++) s += 'abc'[Math.floor(Math.random() * 3)]
            return s
        }
        let bad = 0
        for (let t = 0; t < 2000; t++) {
            const a = rnd(), b = rnd(), c = rnd()
            if (minDistance(a, b) !== minDistance(b, a)) bad++          // 对称
            if (minDistance(a, a) !== 0) bad++                          // 自反
            if (minDistance('', a) !== a.length) bad++                  // 空串
            if (minDistance(a, c) > minDistance(a, b) + minDistance(b, c)) bad++  // 三角不等式
        }
        console.log('数学性质自查 2000 组 (对称/自反/空串/三角不等式):', bad === 0 ? '全部成立 ✓' : bad + ' 处违反')

        // 压力测试: 题目上限 500 x 500
        const A = Array.from({ length: 500 }, () => 'abcdefghij'[Math.floor(Math.random() * 10)]).join('')
        const B = Array.from({ length: 500 }, () => 'abcdefghij'[Math.floor(Math.random() * 10)]).join('')
        console.time('500x500 二维')
        const r1 = minDistance(A, B)
        console.timeEnd('500x500 二维')
        console.time('500x500 一维')
        const r2 = minDistance1D(A, B)
        console.timeEnd('500x500 一维')
        console.log('两者结果:', r1, r2, r1 === r2 ? '(一致)' : '(不一致!)')
    }
</script>
<body>
    <div onclick="dianji()" class="aa">点击</div>
</body>
</html>
