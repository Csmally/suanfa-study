<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    body {
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: pink;
    }
    .aa {
        width: 200px;
        height: 200px;
        border-radius: 50%;
        background: #35d4ec;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 35px;
    }
</style>
<script src="./17-技巧/287.寻找重复数.js"></script>
<script>
    function dianji() {
        const cases = [
            [[1, 3, 4, 2, 2], 2],   // 示例 1
            [[3, 1, 3, 4, 2], 3],   // 示例 2
            [[3, 3, 3, 3, 3], 3],   // 示例 3  重复了 5 次
            [[1, 1], 1],            // n=1 的最小情况
            [[1, 2, 2], 2],
            [[2, 2, 2, 2], 2],
            [[2, 1, 2], 2]          // 重复值落在下标 0 上
        ]
        for (const [arr, exp] of cases) {
            const all = [
                findDuplicate(arr),        // Floyd 判圈: O(n)/O(1)，唯一最优
                findDuplicateBinary(arr),  // 二分 + 抽屉原理
                findDuplicateBit(arr),     // 按位统计
                findDuplicateSet(arr)      // Set（空间不达标，只作对照）
            ]
            const ok = all.every(v => v === exp)
            console.log(
                ok ? 'PASS' : 'FAIL',
                JSON.stringify(arr).padEnd(24),
                'Floyd:', String(all[0]).padEnd(3),
                '二分:', String(all[1]).padEnd(3),
                '位统计:', String(all[2]).padEnd(3),
                'Set:', String(all[3]).padEnd(3),
                '期望', exp
            )
        }

        // ★ 把数组"当成链表"看一眼 ★
        const walk = (arr, steps) => {
            const path = [0]
            let cur = 0
            for (let i = 0; i < steps; i++) { cur = arr[cur]; path.push(cur) }
            return path.join(' → ')
        }
        console.log('链表视角（下标 i 指向 nums[i]）:')
        console.log('  [1,3,4,2,2] ->', walk([1, 3, 4, 2, 2], 8), ' ← 环入口 2 就是答案')
        console.log('  [3,1,3,4,2] ->', walk([3, 1, 3, 4, 2], 8), ' ← 环入口 3 就是答案')

        // ★ 最常见的错法: 阶段一相遇后直接返回（漏掉阶段二）★
        const wrong = function (nums) {
            let slow = 0, fast = 0
            do { slow = nums[slow]; fast = nums[nums[fast]] } while (slow !== fast)
            return slow     // ← 只做了阶段一，返回的是"环内相遇点"
        }
        console.log('漏掉阶段二（直接返回相遇点）的错法:')
        for (const arr of [[1, 3, 4, 2, 2], [3, 1, 3, 4, 2]]) {
            console.log(
                '  ', JSON.stringify(arr),
                '相遇点 =', wrong(arr), ' 正确答案 =', findDuplicate(arr),
                wrong(arr) === findDuplicate(arr) ? '(碰巧对了)' : '← 错在这'
            )
        }
        console.log('  -> 实测 2 万组里这种错法出错率 32.1%')

        // 确认不改数组
        const origin = [1, 3, 4, 2, 2]
        const snapshot = JSON.stringify(origin)
        findDuplicate(origin); findDuplicateBinary(origin); findDuplicateBit(origin)
        console.log('数组有没有被改动:', JSON.stringify(origin) === snapshot ? '没改 ✓（符合题目要求）' : '被改了 ✗')

        // 压力测试: 题目上限 n = 10^5
        const N = 100000
        const big = []
        for (let v = 1; v <= N; v++) big.push(v)
        big.push(1 + Math.floor(Math.random() * N))
        const dupVal = big[big.length - 1]
        for (let i = big.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1))
            ;[big[i], big[j]] = [big[j], big[i]]
        }
        console.time('n=100000 Floyd')
        const r1 = findDuplicate(big)
        console.timeEnd('n=100000 Floyd')
        console.time('n=100000 二分 ')
        const r2 = findDuplicateBinary(big)
        console.timeEnd('n=100000 二分 ')
        console.log('n=100000 ->', r1, r2, '期望', dupVal, (r1 === dupVal && r2 === dupVal) ? '(都对)' : '(有错!)')
    }
</script>
<body>
    <div onclick="dianji()" class="aa">点击</div>
</body>
</html>
