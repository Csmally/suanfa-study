<script>
    function dianji() {
        const cases = [
            [[1, 2, 3], 6],                                    // 示例 1: 2 -> 1 -> 3
            [[-10, 9, 20, null, null, 15, 7], 42],             // 示例 2: 15 -> 20 -> 7
            [[-3], -3],                                        // 单节点负数,考验 best 初值
            [[-2, -1], -1],                                    // 全负数
            [[-1, -2, -3], -1],
            [[2, -1], 2],
            [[1, -2, 3], 4],                                   // 最优路径绕开中间的负数
            [[-10, 9, 20, null, null, 15, 7, -5, -8], 42]
        ]
        for (const [input, exp] of cases) {
            const a = maxPathSum(toTree(input))
            const b = maxPathSumIterative(toTree(input))
            const ok = a === exp && b === exp
            console.log(ok ? 'PASS' : 'FAIL', JSON.stringify(input).padEnd(42), '递归:', String(a).padEnd(5), '迭代:', String(b).padEnd(5), '期望', exp)
        }
    }
</script>

    <div onclick="dianji()" class="aa">点击</div>
